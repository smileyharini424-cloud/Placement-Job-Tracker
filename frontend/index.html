<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Placement Job Tracker</h1>
        <p>Track your applications. Stay ready for your next opportunity.</p>
    </header>

    <main>
        <section class="summary">
            <div class="card">
                <h3>Total Applications</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="card">
                <h3>Interviews</h3>
                <p id="interviewCount">0</p>
            </div>
            <div class="card">
                <h3>Offers</h3>
                <p id="offerCount">0</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Add a Job Application</h2>

            <form id="jobForm">
                <input id="company" type="text"
                       placeholder="Company name" required>

                <input id="role" type="text"
                       placeholder="Job role" required>

                <input id="date" type="date" required>

                <select id="status" required>
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>

                <button type="submit">Add Application</button>
            </form>
        </section>

        <section class="applications">
            <h2>My Applications</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Role</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="jobList"></tbody>
                </table>
            </div>
            <p id="emptyMessage">No applications yet. Add your first one!</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
